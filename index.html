<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRU — Martín Cru · Digital design, art direction & illustration</title>
  <meta name="description" content="Portfolio of Martín Cru (CRU): digital design, branding, art direction and illustration. Madrid, Spain.">
  <link rel="canonical" href="https://martincru.com/">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://martincru.com/">
  <meta property="og:title" content="CRU — Martín Cru">
  <meta property="og:description" content="Digital design, branding, art direction and illustration. Madrid, Spain.">
  <meta property="og:image" content="https://martincru.com/assets/media/summ/portada.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Tipografías alojadas en la propia web (assets/fonts): sin conexiones a terceros -->
  <link rel="preload" href="assets/fonts/inter-tight-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v=20">
</head>
<body data-page="home">
  <a class="skip mono" href="#works" data-i18n="skipWorks">Skip to works</a>

  <header class="site-header">
    <a class="logo" href="index.html" data-logo aria-label="CRU — home" data-i18n-aria="logoAria">CRU</a>
    <nav class="mono">
      <a class="link-u" href="#works" data-i18n="navWorks">Works</a>
      <a class="link-u" href="#about" data-i18n="navAbout">About</a>
      <a class="link-u" href="#contact" data-i18n="navContact">Contact</a>
      <a class="link-u ext" data-photo-link target="_blank" rel="noopener" data-i18n="navPhoto">Photography ↗</a>
    </nav>
  </header>

  <main>
    <section class="hero" data-bg="#ffffff" data-fg="#0b0b0b">
      <div class="hero-top">
        <h1 id="hero-line"></h1>
        <div class="hero-reel" id="hero-reel" aria-label="Selected works" data-i18n-aria="selectedWorks"></div>
      </div>
      <div class="hero-foot" id="hero-meta"></div>
    </section>

    <section class="works" id="works" data-bg="#ffffff" data-fg="#0b0b0b">
      <div class="works-head mono">
        <span><span data-i18n="selectedWorks">Selected works</span> <span class="muted" id="works-count"></span></span>
        <div class="filter-drop" id="filter-drop">
          <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters"><span class="filter-label" data-i18n="filter">Filter</span><span class="filter-current">All</span><span class="filter-icon" aria-hidden="true"></span></button>
          <div class="filters" id="filters" role="group" aria-label="Filter works" data-i18n-aria="filterWorks"></div>
        </div>
      </div>
      <div class="grid" id="works-grid"></div>
    </section>

    <section class="about" id="about" data-bg="#0b0b0b" data-fg="#ffffff">
      <div class="about-grid">
        <div class="about-label" data-reveal>
          <span class="mono" data-i18n="whoIs">Who is cru?</span>
          <figure class="about-photo" id="about-photo"></figure>
        </div>
        <p class="about-text" id="about-text" data-reveal></p>
        <p class="about-more" id="about-more" data-reveal></p>
      </div>
      <div class="skills mono" id="skills"></div>
    </section>

    <section class="contact" id="contact" data-bg="#0b0b0b" data-fg="#ffffff">
      <p class="closing mono muted" id="closing"></p>
      <a class="big-link" id="contact-link" href="#" data-cursor="write"><span data-i18n="letsTalk">let's talk&nbsp;→</span></a>
      <div class="contact-grid mono">
        <div><span class="muted" data-i18n="email">Email</span><br><a class="link-u" id="contact-email" href="#"></a> <button type="button" class="copy mono" id="copy-email" data-i18n="copy">copy</button></div>
        <div id="contact-socials"></div>
        <div><span class="muted" data-i18n="basedIn">Based in</span><br><span id="contact-loc"></span></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer" data-bg="#0b0b0b" data-fg="#ffffff"></footer>

  <script src="assets/js/data.js?v=20"></script>
  <script src="assets/js/main.js?v=20"></script>
</body>
</html>
